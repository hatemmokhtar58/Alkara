name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API build and tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ptest"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      ALKARA_TEST_MYSQL: server=127.0.0.1;port=3306;user=root;password=test
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore Alkara.sln
      - run: dotnet build Alkara.sln --no-restore
      - run: dotnet test Alkara.sln --no-build --logger "console;verbosity=normal"

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    name: End-to-end working day
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ptest"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      E2E_MYSQL: server=127.0.0.1;port=3306;user=root;password=test
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - run: dotnet build api/api.csproj
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results

  deploy:
    name: Production stack and backup restore
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy
    steps:
      - uses: actions/checkout@v4
      - name: Write a throwaway .env
        run: |
          cat > .env <<ENV
          DOMAIN=localhost
          MYSQL_ROOT_PASSWORD=$(openssl rand -hex 16)
          MYSQL_PASSWORD=$(openssl rand -hex 16)
          JWT_SECRET=$(openssl rand -base64 48)
          INITIAL_ADMIN_USERNAME=admin
          INITIAL_ADMIN_PASSWORD=Ci-Admin-Pass-123
          BACKUP_REMOTE=$RUNNER_TEMP/offsite
          ENV
      - run: docker compose up -d --build --wait
      - name: Site and login work over HTTPS
        run: |
          for i in $(seq 1 30); do curl -skf https://localhost/ >/dev/null && break; sleep 2; done
          curl -skf https://localhost/ | grep -q '<div id="root">'
          for i in $(seq 1 30); do curl -skf -X POST https://localhost/api/Auth/login -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"Ci-Admin-Pass-123"}' | grep -q token && exit 0; sleep 2; done; exit 1
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq rclone
      - name: Back up, lose data, restore
        env:
          BACKUP_DIR: ${{ runner.temp }}/backups
        run: |
          users() { docker compose exec -T db sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -uroot -N alkara_db -e "SELECT COUNT(*) FROM Users"'; }
          before=$(users)
          sudo -E ./backup.sh
          docker compose exec -T db sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -uroot -e "DROP DATABASE alkara_db"'
          sudo -E RESTORE_YES=1 ./restore.sh latest
          [ "$(users)" = "$before" ]
          docker compose up -d --wait
          for i in $(seq 1 30); do curl -skf -X POST https://localhost/api/Auth/login -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"Ci-Admin-Pass-123"}' | grep -q token && exit 0; sleep 2; done; exit 1
      - if: failure()
        run: docker compose logs
